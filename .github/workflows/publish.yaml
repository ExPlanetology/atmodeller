name: Publish on PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # The full CI (pre-commit and tests on every platform) must pass before publishing
  tests:
    uses: ./.github/workflows/ci.yml
    # Passes CODECOV_TOKEN (if set) to the coverage upload
    secrets: inherit

  deploy:
    needs: tests
    # Only a published, non-pre-release GitHub release uploads to PyPI; a manual run only runs
    # the tests. (On a manual run there is no release, and null == false would be true.)
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    # Settings > Environments > release can require a manual approval before publishing
    environment: release
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # The same uv version as used to write uv.lock
          version: "0.12.3"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Build
        run: uv build

      - name: Check the package metadata
        run: uvx twine check --strict dist/*

      - name: Publish
        run: uv publish
